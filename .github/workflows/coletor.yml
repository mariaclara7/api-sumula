name: Coletor

# Busca os dados no football-data.org, gera a "API pré-calculada" (arquivos .json) e publica na Cloudflare
# como o Worker "sumula-dados".
#
# Secrets (Settings > Secrets and variables > Actions > Secrets):
#   FOOTBALL_DATA_TOKEN, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# Variável opcional (aba Variables): FOOTBALL_DATA_DETALHADO = true com o plano "Free + Deep Data",
# para coletar os gols com minuto.
on:
  schedule:
    - cron: "17 */3 * * *" # a cada 3 horas
  workflow_dispatch: # permite rodar na mão pela aba Actions

concurrency:
  group: coletor
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    # Cada coleta busca a temporada inteira de novo, então o banco só precisa existir durante a execução:
    # um Postgres descartável, que some quando o job termina.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sumula
          POSTGRES_USER: sumula
          POSTGRES_PASSWORD: sumula
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__Sumula: Host=localhost;Database=sumula;Username=sumula;Password=sumula
    steps:
      # Sem os secrets, o workflow termina sem erro e avisa o que falta (em vez de falhar a cada 3 horas).
      - name: Verifica a configuração
        id: config
        run: |
          if [ -n "$FD_TOKEN" ]; then echo "coleta=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Falta o secret FOOTBALL_DATA_TOKEN. A coleta não vai rodar (veja o README)."; fi
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_CONTA" ]; then echo "cloudflare=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Faltam CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID: os dados não serão publicados."; fi
        env:
          FD_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_CONTA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/checkout@v4
        if: steps.config.outputs.coleta == 'true'
      - uses: actions/setup-dotnet@v4
        if: steps.config.outputs.coleta == 'true'
        with:
          dotnet-version: 8.0.x

      - name: Coleta os dados
        if: steps.config.outputs.coleta == 'true'
        run: dotnet run --project src/Sumula.Coletor -c Release
        env:
          FootballData__Token: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          FootballData__DadosDetalhados: ${{ vars.FOOTBALL_DATA_DETALHADO || 'false' }}

      - name: Gera os arquivos da API
        if: steps.config.outputs.coleta == 'true'
        run: dotnet run --project src/Sumula.Exportador -c Release
        env:
          Exportacao__Saida: ${{ github.workspace }}/publicacao/saida

      - name: Publica na Cloudflare
        if: steps.config.outputs.coleta == 'true' && steps.config.outputs.cloudflare == 'true'
        working-directory: publicacao
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
